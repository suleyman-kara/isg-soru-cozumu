stion": "Which of the following is the construction equipment used in excavation, filling, splitting, pulling and pushing operations?", "options": {"A": "grader", "B": "Backhoe Loader", "C": "floor sweeping machine", "D": "Dozer"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 202, "test": 15, "question": "The machine cannot be used on roads open to vehicular traffic with a construction machine operator certificate. Which class license is required to use the machine on roads open to vehicular traffic?", "options": {"A": "C", "B": "TO", "C": "G", "D": "D"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 203, "test": 15, "question": "Which of the following is not included in the scope of G class licensed construction machines?", "options": {"A": "Backhoe Loader", "B": "concrete pump", "C": "excavator", "D": "Vibrator"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 205, "test": 15, "question": "Which of the following is not a sufficient level of training to be given to the maintenance-repair team?", "options": {"A": "accident detection", "B": "“Work permit” considerations in maintenance work", "C": "Electrical and mechanical safety", "D": "Principles of machine protection"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 206, "test": 15, "question": "Which of the following is not among the objectives of maintenance-repair works?", "options": {"A": "Taking necessary precautions when accidents occur", "B": "Extending the life of the plant", "C": "Detecting and taking precautions without malfunction and accident", "D": "Ensuring the system works properly"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 207, "test": 15, "question": "Which of the following is not one of the causes of electrocution, which is one of the common types of accidents in maintenance and repair works?", "options": {"A": "Due to the inadequacy of the insulation of the mobile electrical devices used.", "B": "Since the system is not de-energized", "C": "Since the medium is a very conductive medium,", "D": "Since the mobile lighting lamps are low voltage (24 Volt)"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 209, "test": 15, "question": "Which of the following is not one of the times of performing occupational health and safety activities in maintenance and repair works?", "options": {"A": "During maintenance-repair", "B": "Before maintenance-repair", "C": "After maintenance-repair", "D": "during an emergency"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 210, "test": 15, "question": "Which of the following is within the scope of security measures in electrical maintenance-repair works?", "options": {"A": "Voltage should not be interrupted before starting the work to be done in low voltage facilities.", "B": "For low voltage (LV Glove), for high voltage (HV Glove) should be used", "C": "Insulating gloves and insulating handles should not be used.", "D": "A conductive object should be considered unless there is an operation involving climbing a pole without a platform."}, "answer": "B", "answers_accepted": ["B"]}, {"id": 211, "test": 15, "question": "Which of the following is not included in the scope of occupational safety in machine maintenance?", "options": {"A": "The electrical circuit of the machine taken into maintenance should be cut off and locked. If there is no device, insurance should be taken and a warning sign (card) should be hung on it.", "B": "No maintenance should be done on the working machine.", "C": "Toxic and dangerous work should be done after dark unless it is necessary.", "D": "Work should not be started without taking the measures prescribed by the Occupational Safety authorities (ISGB or OSGB)."}, "answer": "C", "answers_accepted": ["C"]}, {"id": 212, "test": 15, "question": "Which of the following is not among the general occupational health and safety measures in maintenance-repair works?", "options": {"A": "When working in boilers or containers, not to go inside before the temperature falls within the safety limits.", "B": "Do not leave acetylene and oxygen cylinders in direct sunlight or extreme cold when using, storing them.", "C": "Instead of holding the tool that your friend hits with a hammer or something heavy, using suitable tools such as a pair of pincers or grippers.", "D": "Manually cleaning the chips from drills, milling machines and lathes"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 213, "test": 15, "question": "Which of the following is not one of the reasons that distinguishes accidents in maintenance-repair works from other accidents?", "options": {"A": "At the end of the work, the previously removed safety measures were not re-inserted.", "B": "Before maintenance-repair, not taking the necessary precautions before starting the work, starting the work as soon as possible", "C": "Failure to obtain permission from the necessary places, failure of the permitting authorities to take the necessary measures", "D": "Doing the work without rushing, doing it in a planned way"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 215, "test": 15, "question": "According to article 365 of the occupational health and safety regulations published in the Official Gazette numbered 11.1.1974, which of the following statements about jacks is incorrect?", "options": {"A": "Necessary measures should be taken to lower the loads with a jack.", "B": "Jacks must be placed firmly on the ground when lifting the load.", "C": "Jacks should be placed horizontally when lifting the load.", "D": "After the loads are lifted to the desired height, it should not be worked under or above these loads unless the jacks are fed with durable and suitable wedges."}, "answer": "C", "answers_accepted": ["C"]}, {"id": 216, "test": 15, "question": "Which of the following is not among the causes of accident occurring in the use of sharpening and grinding wheels?", "options": {"A": "Does not make unbalanced oscillations as it is kept intact", "B": "Manual removal of dust and burrs", "C": "Using damaged wheels", "D": "Electric motor not grounded"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 218, "test": 15, "question": "Which of the following is not among the safety measures that should be taken in order to ensure a safe operation during the use of power tools?", "options": {"A": "Those who use rotary tools such as electric drills, saws and grinding wheels should not wear gloves (other than gloves), ties, necklaces, and loose clothing.", "B": "Employees who are suitable for the risk of dropping heavy electrical appliances should be cautious (wearing special protective shoes, etc.)", "C": "Glasses, face shields, etc. for dust generated during the use of tools such as chisels, drills, sharpening, polishing wheels and brushes. should be used", "D": "Grounded electric motors should not be used."}, "answer": "D", "answers_accepted": ["D"]}, {"id": 220, "test": 15, "question": "Which of the following is not among the general issues to be followed in workplaces?", "options": {"A": "It should be checked whether the workpiece or the mold is securely fastened.", "B": "Behaviors that do not comply with the working order, other employees should not be disturbed or distracted", "C": "When more than one person is working on the same workbench, the control of the workbench should be done by one person.", "D": "Workbench must be stopped by hand or body"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 221, "test": 15, "question": "Which of the following is not among the general principles about the safe use of hand tools?", "options": {"A": "Since hand tools are tools that require constant maintenance, the durability of these tools should be checked at the beginning and end of almost every work.", "B": "After the tools have been cleaned and the essentials lubricated, they should be put back in their place.", "C": "The worker must learn to use every tool required by the job himself.", "D": "Before the tools are used, they should be inspected and necessary repairs should be made."}, "answer": "C", "answers_accepted": ["C"]}, {"id": 222, "test": 15, "question": "Which of the following is among the points to be considered in the use of files?", "options": {"A": "File chips should be cleaned carefully by blowing.", "B": "The workpiece must be clamped in a vice to avoid vibration during filing.", "C": "In filing, the movement of the body should be constant so that the legs do not get tired quickly.", "D": "The file is held with the left hand (with four fingers from the bottom and the thumb from the top of the file)."}, "answer": "B", "answers_accepted": ["B"]}, {"id": 224, "test": 15, "question": "According to the scope of the Ministry of Labor and Social Security, “Labor Inspection Board Project Supervision Evaluation Report in Underground and Surface Mining Operations-April 2005”, which determination is most striking according to the accident causes ranking?", "options": {"A": "Fall", "B": "Material Drop", "C": "Machinery Equipment", "D": "Dent"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 225, "test": 15, "question": "According to the scope of the Ministry of Labor and Social Security, “Labor Inspection Board Project Supervision Evaluation Report in Underground and Surface Mining Enterprises-April 2005”, which determination stands out the most in the order of Organization, Supervision and General Working Conditions?", "options": {"A": "Workers do not have health reports / It does not comply with the example in the Heavy and Dangerous Works Regulation.", "B": "Workers were not trained.", "C": "Steel-toed shoes, hard hats and dust masks were not given to the workers. The use of personal protective equipment is insufficient.", "D": "Machinery operators do not have a license."}, "answer": "A", "answers_accepted": ["A"]}, {"id": 226, "test": 15, "question": "According to the Regulation on Health and Safety Conditions in Underground and Surface Mining Operations, workplaces operating on the effective date of the regulation must comply with the health and safety requirements specified in the annex of this regulation, within how long after the effective date of the regulation.", "options": {"A": "30 days", "B": "90 Days", "C": "1 year", "D": "2 years"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 227, "test": 15, "question": "On slopes with a height of ... m and a slope of more than ... degrees, safety belts, hard hats, safety shoes, etc. should be provided to the workers during the removal of the shells. Personal protective equipment must be used. What should come in the blank?", "options": {"A": "5.30", "B": "10.15", "C": "5.15", "D": "10.30"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 228, "test": 15, "question": "Which of the following is not among the Alternative Mining Methods?", "options": {"A": "Solution Mining", "B": "Underground Gasification Methods", "C": "Seabed Mining", "D": "Mezzanine Flap Method"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 230, "test": 15, "question": "The employer shall notify the relevant Regional Directorate of the Ministry of Labor and Social Security of serious or fatal work accidents and serious dangerous incidents within ... working days at the latest. What should be in the blank?", "options": {"A": "15", "B": "2nd", "C": "5", "D": "30"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 232, "test": 15, "question": "According to the Regulation on Health and Safety Conditions in Underground and Surface Mining Operations, which of the following cannot be true?", "options": {"A": "The employer shall provide suitable escape and rescue vehicles and keep them ready for use so that workers can leave their workplaces as soon as possible and safely in case of danger.", "B": "If there are workers belonging to more than one enterprise in the same workplace, only one of the employers is responsible.", "C": "Periodic health surveillance will be carried out during the employment of the workers and during the continuation of the work.", "D": "Necessary security drills will be conducted at regular intervals."}, "answer": "B", "answers_accepted": ["B"]}, {"id": 233, "test": 15, "question": "Which of the following is not among the Underground Mine Production Methods?", "options": {"A": "Long Foot Production Method", "B": "Filled Methods", "C": "Drilling Production Methods", "D": "Warehouse Excavation Method"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 234, "test": 15, "question": "Which of the following is not expected from an effective occupational health and safety management in construction works?", "options": {"A": "Educating employees about safety", "B": "Ensuring job security", "C": "Informing only risky studies about the level of risk", "D": "Ensuring environmental safety"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 235, "test": 15, "question": "Which of the following is not one of the components that should be included in the safety plans in construction works?", "options": {"A": "Crisis Forecasts", "B": "Disciplinary Policy and Criminal Liability", "C": "Accident Investigation", "D": "Health and Safety Policy"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 236, "test": 15, "question": "Which of the following refers to the natural or legal person assigned by the Employer and responsible for the preparation, implementation and control of the implementation of the project on behalf of the employer?", "options": {"A": "Site chief", "B": "Project manager", "C": "Preparation Coordinator", "D": "Implementation Coordinator"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 237, "test": 15, "question": "Which of the following cannot be obtained as a result of occupational health and safety practices in construction works?", "options": {"A": "Costs go down", "B": "Increased response time to customer requests", "C": "Productivity increases", "D": "Quality increases"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 240, "test": 15, "question": "Which of the following is not within the scope of the responsibility of security experts?", "options": {"A": "Hazard Analysis", "B": "Security controls", "C": "Establishing and executing the company's commitment to health and safety", "D": "Education"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 241, "test": 15, "question": "Which of the following is the equivalent of the third violation to be made according to the four-step system within the scope of the security discipline in construction works?", "options": {"A": "Written warning and one week suspension or dismissal if authorized", "B": "Written notice, copy to file or personnel affairs", "C": "Written warning, free one day suspension", "D": "Verbal warning, noting in file"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 242, "test": 15, "question": "Which of the following is not one of the documents that should be included in the sample construction safety plan?", "options": {"A": "Risky studies", "B": "Safety and Health Policy", "C": "Work security education", "D": "Safety and Health Purpose"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 243, "test": 15, "question": "Which of the following is not an example of the types of targets that can be included in construction works, health and safety plans of construction companies?", "options": {"A": "Increasing the participation rate of employees in security trainings to 100%,", "B": "Zero fatal accidents throughout the year", "C": "30% increase in workers' compensation claims", "D": "20% reduction in item and equipment damage cost"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 245, "test": 15, "question": "Which of the following cannot be considered as an educational method to be applied in terms of adults' experiences?", "options": {"A": "Imitation, Copy", "B": "Skill practice experiments", "C": "Activity projects", "D": "group therapy"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 246, "test": 15, "question": "Which of the following is not one of the important educational consequences of the difference in experience between children and adults, according to Knowles?", "options": {"A": "Adults have basic experiences that can be used to relate to new experiences or to respond to topics that can be learned from. Thus, if we can associate new learning with our past experiences and establish a relationship between them, then education or training will have a meaning.", "B": "Adults aim to stay away from integrating practical experiences in life with the knowledge they have acquired theoretically.", "C": "Adults contribute more to the learning of others and are a rich resource for many kinds of learning.", "D": "Because adults have largely fixed patterns of behavior and thought, they tend to have less open ideas."}, "answer": "B", "answers_accepted": ["B"]}, {"id": 247, "test": 15, "question": "In which of the following, as a natural result of maturation, the adult is expected to become self-directed, from a dependent personality to an independent personality?", "options": {"A": "Pedagogy", "B": "psychology", "C": "andragogy", "D": "Anthropology"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 248, "test": 15, "question": "Which of the following is a personal barrier that prevents adults from participating in the education program?", "options": {"A": "Inability to find opportunities in housework", "B": "shift work", "C": "economic inadequacy", "D": "Negative attitude towards learning"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 249, "test": 15, "question": "Which of the following is not considered a learning motivation in adults?", "options": {"A": "Social Transfer", "B": "Social Relationship", "C": "Personal Development", "D": "Professional Motives"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 250, "test": 15, "question": "Which of the following is not one of the training programs to be given, as specified in Article 10 of the regulation on the procedures and principles of occupational health and safety training of employees, published in the Official Gazette dated 07/04/2004 and numbered 25426?", "options": {"A": "Additional Education", "B": "New Education", "C": "Pre-Education", "D": "Further Education"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 251, "test": 15, "question": "Which of the following is not one of the barriers to participation in education stemming from adult's home life?", "options": {"A": "body fatigue", "B": "Inability to find opportunities in housework,", "C": "Resistance by one or all family members", "D": "The conditions at home are not conducive to the work required for learning."}, "answer": "A", "answers_accepted": ["A"]}, {"id": 252, "test": 15, "question": "In how many groups are the factors that prevent adults from participating in the training program?", "options": {"A": "4", "B": "2nd", "C": "3", "D": "5"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 253, "test": 15, "question": "Which of the following is not one of the external barriers that prevent adults from participating in the education program?", "options": {"A": "economic inadequacy", "B": "body fatigue", "C": "shift work", "D": "Mental and physical deficiencies"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 254, "test": 15, "question": "Which of the following is not one of the properties of dry chemical powders used in fires?", "options": {"A": "Choke feature.", "B": "Chain burning event prevention feature", "C": "Ability to eliminate combustible material", "D": "Cooling feature"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 255, "test": 15, "question": "Which of the following is an example of slow burning?", "options": {"A": "rusting of iron", "B": "Self-ignition of the coal pile", "C": "smoldering cotton", "D": "Flash of accumulated gas"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 256, "test": 15, "question": "Which of the following is the extinguishing technique that should be applied first in gas fires?", "options": {"A": "cutting the air", "B": "Elimination of combustible material", "C": "chemical reaction", "D": "Cooling"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 257, "test": 15, "question": "For which class of fire is water the best extinguishing agent?", "options": {"A": "Class A", "B": "class B", "C": "class D", "D": "C class"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 258, "test": 15, "question": "Which of the following is not one of the sides of the fire triangle?", "options": {"A": "Carbon dioxide", "B": "Heat", "C": "Flammable material", "D": "Oxygen"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 259, "test": 15, "question": "Which of the following is not a manual fire extinguisher?", "options": {"A": "foam extinguisher", "B": "nitrogen extinguisher", "C": "carbon dioxide extinguisher", "D": "water extinguisher"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 260, "test": 15, "question": "Which of the following is not a manual fire extinguisher?", "options": {"A": "foam extinguisher", "B": "nitrogen extinguisher", "C": "carbon dioxide extinguisher", "D": "water extinguisher"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 261, "test": 15, "question": "Which of the following is not one of the cooling techniques?", "options": {"A": "water cooling", "B": "disperse the combustible material", "C": "Choke", "D": "Strong blowing"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 262, "test": 15, "question": "Which of the following is not one of the foam types used in fire extinguishing?", "options": {"A": "ATP type foam", "B": "synthetic foam", "C": "chemical foam", "D": "mechanical foam"}, "answer": "A", "answers_accepted": ["A"]}, {"id": 263, "test": 15, "question": "Which class of fire is considered an electrical fire?", "options": {"A": "A", "B": "B", "C": "D", "D": "E-type"}, "answer": "D", "answers_accepted": ["D"]}, {"id": 264, "test": 15, "question": "Which extinguisher is inconvenient to use in liquid combustible fires?", "options": {"A": "Foam", "B": "Carbon dioxide", "C": "That", "D": "Dry chemical powder"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 265, "test": 15, "question": "Which of the following is not among the basic protection and security measures that employees can apply?", "options": {"A": "Liquid-absorbent barriers against Spills", "B": "Closing file cabinets and drawers", "C": "Establishing permanent barriers by removing temporary barriers", "D": "Closing doors and windows"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 266, "test": 15, "question": "Which of the following is an incorrect statement about personal first aid packages?", "options": {"A": "How and in what way the personal first aid package will be used when necessary, will be taught, a written instruction will be included in the package.", "B": "The personal first aid pack shall be placed in the pocket of the work suit or tied to a suitable place so that it does not interfere with work and does not fall.", "C": "Personal first aid packages will be given to workers in workplaces that have a high probability of accidents, such as mine, tunnel, underground highway and railway workers, and that require scattered and individual work", "D": "These packages will be kept in a large and useful metal box that will protect materials and drugs against external influences."}, "answer": "D", "answers_accepted": ["D"]}, {"id": 267, "test": 15, "question": "What is the management of resources, analysis of incoming information and decision making?", "options": {"A": "coordinated activity", "B": "executive", "C": "Direction and control", "D": "planning"}, "answer": "C", "answers_accepted": ["C"]}, {"id": 268, "test": 15, "question": "In which periods should the smoke detector, which should be installed against fire, be checked?", "options": {"A": "quarterly", "B": "once a month", "C": "every twelve months", "D": "once in a six month"}, "answer": "B", "answers_accepted": ["B"]}, {"id": 269, "test": 15, "question": "Which of the following is not one of the s const KEY='isg_stats_v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)); // S[id]={c:doğru,w:yanlış,last:true/false}
const $=document.getElementById('app');
let queue=[],i=0,answered=false,sess={c:0,w:0};
const tests=[...new Set(DATA.map(q=>q.test))].sort((a,b)=>a-b);
const wrongList=()=>DATA.filter(q=>S[q.id]&&S[q.id].last===false);
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};

function home(){
 const done=DATA.filter(q=>S[q.id]).length,w=wrongList().length;
 const tot=Object.values(S).reduce((a,x)=>[a[0]+x.c,a[1]+x.w],[0,0]);
 $.innerHTML=`<div class="card"><b>Kayıt</b><br>Çözülen: ${done}/${DATA.length} · Şu an yanlış: ${w}<br>
 Toplam doğru: ${tot[0]} · Toplam yanlış: ${tot[1]}</div>
 <div class="card"><div class="row"><select id="t"><option value="all">Tüm testler</option>${tests.map(t=>`<option value="${t}">Test ${t}</option>`).join('')}</select>
 <select id="m"><option value="new">Çözülmemişler</option><option value="all">Hepsi</option></select>
 <button class="p" onclick="start()">Başla</button></div></div>
 <div class="card"><button class="p" onclick="startWrong()" ${w?'':'disabled'}>Yanlışları tekrar çöz (${w})</button>
 <button onclick="if(confirm('Tüm kayıt silinsin mi?')){S={};save();home()}">Kaydı sıfırla</button></div>`;
}
function start(){
 const t=document.getElementById('t').value,m=document.getElementById('m').value;
 let l=DATA.filter(q=>t==='all'||q.test==+t);
 if(m==='new')l=l.filter(q=>!S[q.id]);
 if(!l.length)return alert('Bu seçimde soru kalmadı.');
 run(shuffle(l));
}
function startWrong(){run(shuffle(wrongList()))}
function run(l){queue=l;i=0;sess={c:0,w:0};show()}
function show(){
 if(i>=queue.length){$.innerHTML=`<div class="card"><b>Bitti!</b><br>Doğru: ${sess.c} · Yanlış: ${sess.w}</div><button class="p" onclick="home()">Ana sayfa</button>`;return}
 const q=queue[i];answered=false;
 $.innerHTML=`<small>${i+1}/${queue.length} · Test ${q.test} · #${q.id}</small><div class="card"><p>${q.question}</p>
 ${Object.entries(q.options).map(([k,v])=>`<button class="opt" id="o${k}" onclick="pick('${k}')"><b>${k})</b> ${v}</button>`).join('')}</div>
 <div class="row"><button onclick="home()">Çık</button><button class="p" id="nx" style="display:none" onclick="i++;show()">Sonraki</button></div>`;
}
function pick(k){
 if(answered)return;answered=true;const q=queue[i];
 const acc=q.answers_accepted&&q.answers_accepted.length?q.answers_accepted:[q.answer];
 const ok=acc.includes(k);
 const s=S[q.id]||(S[q.id]={c:0,w:0});
 ok?(s.c++,sess.c++):(s.w++,sess.w++);s.last=ok;save();
 acc.forEach(a=>document.getElementById('o'+a).classList.add('ok'));
 if(!ok)document.getElementById('o'+k).classList.add('bad');
 document.getElementById('nx').style.display='';
}
home();
</script></body></html>
