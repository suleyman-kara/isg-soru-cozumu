 in the workplace?", "options": {"A": "Radiant heat", "B": "Gases (flammable, burning, suffocating, narcotic)", "C": "Liquids (acids, bases, solvents)", "D": "Solid powders (organic, inorganic)"}, "answer": "A", "answers_accepted": ["A"], "test": 10}, {"id": 993, "question": "Is it not useful to make risk assessment work as a team according to the nature of the business? Which of the following is the cause of the crime?", "options": {"A": "Gives seriousness to the participants and spirit of business association", "B": "All the necessary information is provided by the employees", "C": "Intra-team interaction can affect the end result.", "D": "Everyone can get satisfying results"}, "answer": "C", "answers_accepted": ["C"], "test": 10}, {"id": 994, "question": "Which workplace should the obligation to perform risk assessment be covered by the Labor Code?", "options": {"A": "Dangerous work places", "B": "All businesses", "C": "Great work places", "D": "Workplaces employing 50 or more workers"}, "answer": "B", "answers_accepted": ["B"], "test": 10}, {"id": 995, "question": "Which of the following is not one of the key steps in risk assessment?", "options": {"A": "Identification of hazards", "B": "Determination of measures", "C": "Training of employees", "D": "Assessing risks"}, "answer": "C", "answers_accepted": ["C"], "test": 10}, {"id": 996, "question": "Which of the following is not from the \"Insecure Situations\" seen in the workplace?", "options": {"A": "Electric machines without body grounding", "B": "Unopened gaps", "C": "Hazardous machine parts", "D": "Removing machine protectors"}, "answer": "D", "answers_accepted": ["D"], "test": 10}, {"id": 997, "question": "Which is not included in the race assessment?", "options": {"A": "Risk score", "B": "exposed people", "C": "workplace health premiums", "D": "Hazard definitions"}, "answer": "C", "answers_accepted": ["C"], "test": 10}, {"id": 998, "question": "What is the level of risk?", "options": {"A": "40-50", "B": "2-3", "C": "60-100", "D": "20-25"}, "answer": "B", "answers_accepted": ["B"], "test": 10}, {"id": 999, "question": "Risk Assessment must be renewed at the latest?", "options": {"A": "Every 2 years", "B": "Every year", "C": "A workplace that employs 51 workers who are counted as industrial and have been operating for 11 months a year", "D": "Every 10 years"}, "answer": "C", "answers_accepted": ["C"], "test": 10}, {"id": 1000, "question": "Regulations on health and safety measures to be taken in workplace premises and annexes shall be applied in which of the following?", "options": {"A": "In factories and warehouses", "B": "On the fishing boat", "C": "Temporary or Moving business areas", "D": "Mine, oil and gas extraction works"}, "answer": "C", "answers_accepted": ["C"], "test": 10}];
const KEY='isg_stats_v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)); // S[id]={c:doğru,w:yanlış,last:true/false}
let F;try{F=JSON.parse(localStorage.getItem('isg_flags_v1'))||{}}catch(e){F={}}
const saveF=()=>localStorage.setItem('isg_flags_v1',JSON.stringify(F));
const flagList=()=>DATA.filter(q=>F[q.id]);
const $=document.getElementById('app');
let queue=[],i=0,answered=false,sess={c:0,w:0};
const tests=[...new Set(DATA.map(q=>q.test))].sort((a,b)=>a-b);
const scope=()=>{const e=document.getElementById('s');return e?e.value:'500'};
const wrongList=()=>DATA.filter(q=>(scope()==='all'||q.id<=500)&&S[q.id]&&S[q.id].last===false);
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};

function home(sc){
 const done=DATA.filter(q=>S[q.id]).length,w=wrongList().length;
 const tot=Object.values(S).reduce((a,x)=>[a[0]+x.c,a[1]+x.w],[0,0]);
 $.innerHTML=`<div class="card"><b>Kayıt</b><br>Çözülen: ${done}/${DATA.length} · Şu an yanlış: ${w}<br>
 Toplam doğru: ${tot[0]} · Toplam yanlış: ${tot[1]}</div>
 <div class="card"><div class="row"><select id="s" onchange="home(this.value)"><option value="500">İlk 500 (sorumlu)</option><option value="all">Tümü (1-1000)</option></select>
 <select id="m"><option value="new">Çözülmemişler</option><option value="all">Hepsi</option></select>
 <button class="p" onclick="start()">Başla</button></div></div>
 <div class="card"><div class="row"><input id="n" type="number" min="1" placeholder="Soru no" style="padding:10px;width:110px;border-radius:8px;border:1px solid #bbb" onkeydown="if(event.key==='Enter')goQ()"><button class="p" onclick="goQ()">Soruya git</button></div></div>
 <div class="card"><button class="p" onclick="startFlag()" ${flagList().length?'':'disabled'}>İşaretlileri çöz (${flagList().length})</button></div>
 <div class="card"><button class="p" onclick="startWrong()" ${w?'':'disabled'}>Yanlışları tekrar çöz (${w})</button>
 <button onclick="if(confirm('Tüm kayıt silinsin mi?')){S={};save();home()}">Kaydı sıfırla</button></div>`;
 if(sc)document.getElementById('s').value=sc;
}
function start(){
 const m=document.getElementById('m').value;
 const sc=document.getElementById('s').value;
 let l=DATA.filter(q=>(sc==='all'||q.id<=500));
 if(m==='new')l=l.filter(q=>!S[q.id]);
 if(!l.length)return alert('Bu seçimde soru kalmadı.');
 run(shuffle(l));
}
function goQ(){const n=+document.getElementById('n').value,q=DATA.find(x=>x.id===n);if(!q)return alert('Bu numarada soru yok (silinmiş ya da kaynakta eksik olabilir).');run([q])}
function startFlag(){run(shuffle(flagList()))}
function toggleFlag(){const q=queue[i];F[q.id]?delete F[q.id]:F[q.id]=1;saveF();document.getElementById('fl').textContent=F[q.id]?'★ İşaretli':'☆ İşaretle'}
function startWrong(){run(shuffle(wrongList()))}
function run(l){queue=l;i=0;sess={c:0,w:0};show()}
function show(){
 if(i>=queue.length){$.innerHTML=`<div class="card"><b>Bitti!</b><br>Doğru: ${sess.c} · Yanlış: ${sess.w}</div><button class="p" onclick="home()">Ana sayfa</button>`;return}
 const q=queue[i];answered=false;
 $.innerHTML=`<div class="row" style="justify-content:space-between"><small>${i+1}/${queue.length} · #${q.id}</small><button id="fl" onclick="toggleFlag()">${F[q.id]?'★ İşaretli':'☆ İşaretle'}</button></div><div class="card"><p>${q.question}</p>
 ${Object.entries(q.options).map(([k,v])=>`<button class="opt" id="o${k}" onclick="pick('${k}')"><b>${k})</b> ${v}</button>`).join('')}</div>
 <div class="row"><button onclick="home()">Çık</button><button class="p" id="nx" style="display:none" onclick="i++;show()">Sonraki</button></div>`;
}
function pick(k){
 if(answered)return;answered=true;const q=queue[i];
 const acc=q.answers_accepted&&q.answers_accepted.length?q.answers_accepted:[q.answer];
 const ok=acc.includes(k);
 const s=S[q.id]||(S[q.id]={c:0,w:0});
 ok?(s.c++,sess.c++):(s.w++,sess.w++);s.last=ok;save();
 acc.forEach(a=>document.getElementById('o'+a).classList.add('ok'));
 if(!ok)document.getElementById('o'+k).classList.add('bad');
 document.getElementById('nx').style.display='';
}
home();
</script></body></html>
